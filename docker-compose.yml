name: dhun-music

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: musicapp
      MYSQL_USER: musicapp
      MYSQL_PASSWORD: ${DB_PASSWORD:-musicapp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    # max_allowed_packet: downloaded audio is stored as 1 MiB BLOB chunks
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max_allowed_packet=64M"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umusicapp", "-p${DB_PASSWORD:-musicapp}"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: dhun
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/musicapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: musicapp
      DB_PASSWORD: ${DB_PASSWORD:-musicapp}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGESTION_CRON: ${INGESTION_CRON:-0 */15 * * * *}
      INGESTION_RUN_ON_STARTUP: ${INGESTION_RUN_ON_STARTUP:-true}
      DOWNLOAD_MAX_BYTES: ${DOWNLOAD_MAX_BYTES:-104857600}
      ENRICHMENT_ENABLED: ${ENRICHMENT_ENABLED:-true}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-DhunMusicApp/1.0 ( self-hosted )}
      INGESTION_QUERIES: ${INGESTION_QUERIES:-bollywood,hindi songs,arijit singh,bollywood romantic,punjabi}
      JAMENDO_ENABLED: ${JAMENDO_ENABLED:-false}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      JAMENDO_TAGS: ${JAMENDO_TAGS:-indian+bollywood+hindi+world}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-true}
      SESSION_TTL: ${SESSION_TTL:-4h}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Toolbox container: `make dkr-sh` opens a shell here. JDK 21, Node 22, Playwright browsers,
  # make. Every `make` target runs the same inside this container, on the host and in CI.
  dev:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    working_dir: /workspace
    environment:
      IN_CONTAINER: "1"
      DB_URL: jdbc:mysql://mysql:3306/musicapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: musicapp
      DB_PASSWORD: ${DB_PASSWORD:-musicapp}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_PROXY_TARGET: http://backend:8080
      SERVER_PORT: "8081"
      # Testcontainers (acceptance tests) starts sibling containers through the host's Docker.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"   # make run-frontend
      - "8081:8081"   # make run-backend
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - maven-repo:/root/.m2
      # Linux node_modules kept apart from the host's (native binaries differ per OS).
      - frontend-node-modules:/workspace/frontend/node_modules

volumes:
  mysql-data:
  kafka-data:
  maven-repo:
  frontend-node-modules:
