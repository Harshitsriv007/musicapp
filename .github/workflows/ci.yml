name: CI

# Runs on every pull request (required checks before merge) and again on main after the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# CI=true (set by GitHub) makes every `make` target run directly on the runner.
jobs:
  frontend:
    name: Frontend – lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: make lint
      - run: make typecheck
      - run: make test-js-coverage
      - run: make build-js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  frontend-e2e:
    name: Frontend – acceptance tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  backend-unit:
    name: Backend – unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: make test-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  backend-acceptance:
    name: Backend – acceptance tests (Cucumber + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: make test-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-acceptance-reports
          path: |
            backend/target/failsafe-reports
            backend/target/cucumber-report.html
          if-no-files-found: ignore

  docker:
    name: Docker – build images and smoke-test the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make config
      - name: Start stack (no external API calls during CI)
        env:
          INGESTION_RUN_ON_STARTUP: "false"
          INGESTION_CRON: "-"
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/api/songs/new
          curl -fsS -o /dev/null http://localhost:3000/manifest.webmanifest
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - if: always()
        run: docker compose down -v

  # Single required status check for branch protection: passes only if every job passed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [frontend, frontend-e2e, backend-unit, backend-acceptance, docker]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "Some CI jobs did not pass"; exit 1
          fi
