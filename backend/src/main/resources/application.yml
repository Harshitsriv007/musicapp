spring:
  application:
    name: music-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/musicapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:musicapp}
    password: ${DB_PASSWORD:musicapp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  http:
    client:
      connect-timeout: 5s
      read-timeout: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: music-song-ingestor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.musicapp.ingestion.SongEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.musicapp.ingestion,com.musicapp.download
    listener:
      concurrency: 3

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

musicapp:
  ingestion:
    # Every 15 minutes. Set INGESTION_CRON=- to disable.
    cron: ${INGESTION_CRON:0 */15 * * * *}
    run-on-startup: ${INGESTION_RUN_ON_STARTUP:true}
    queries: ${INGESTION_QUERIES:bollywood songs,bollywood hits,hindi songs,bollywood romantic,90s bollywood,arijit singh,shreya ghoshal,atif aslam,jubin nautiyal,sonu nigam,kishore kumar,lata mangeshkar,neha kakkar,pritam}
    limit-per-query: ${INGESTION_LIMIT_PER_QUERY:25}
  kafka:
    songs-topic: ${SONGS_TOPIC:music.songs.discovered}
    downloads-topic: ${DOWNLOADS_TOPIC:music.songs.download-requested}
    partitions: 3
  download:
    # Largest audio file stored per song (bytes). Default 100 MB.
    max-bytes: ${DOWNLOAD_MAX_BYTES:104857600}
  providers:
    audius:
      enabled: ${AUDIUS_ENABLED:true}
      base-url: ${AUDIUS_BASE_URL:https://api.audius.co}
      app-name: ${AUDIUS_APP_NAME:musicapp}
    jamendo:
      enabled: ${JAMENDO_ENABLED:false}
      base-url: ${JAMENDO_BASE_URL:https://api.jamendo.com}
      client-id: ${JAMENDO_CLIENT_ID:}
      # A track matching any of these tags is fetched (Jamendo is indie music: no label Bollywood hits).
      tags: ${JAMENDO_TAGS:indian+bollywood+hindi}
      # Also searched by name on every full sync.
      searches: ${JAMENDO_SEARCHES:bollywood,hindi,punjabi}
      # Full sync = every matching track (most popular first), up to max-tracks per tag list / search.
      max-tracks: ${JAMENDO_MAX_TRACKS:2000}
      full-sync-interval: ${JAMENDO_FULL_SYNC_INTERVAL:6h}
      request-interval: ${JAMENDO_REQUEST_INTERVAL:1s}
  enrichment:
    # Look up each song's original release year in MusicBrainz (free) for the decade folders.
    enabled: ${ENRICHMENT_ENABLED:true}
    base-url: ${MUSICBRAINZ_BASE_URL:https://musicbrainz.org}
    # MusicBrainz asks clients to identify themselves; add a contact URL/email if you run this publicly.
    user-agent: ${MUSICBRAINZ_USER_AGENT:DhunMusicApp/1.0 ( self-hosted )}
    batch-size: 30
    min-interval: 1100ms
    initial-delay: ${ENRICHMENT_INITIAL_DELAY:30s}
    interval: ${ENRICHMENT_INTERVAL:1m}
  auth:
    # "Forgot password" resets a password from just the username (no email / code check).
    # Set PASSWORD_RESET_ENABLED=false before exposing the app to people you don't trust.
    password-reset-enabled: ${PASSWORD_RESET_ENABLED:true}
    # How long a login lasts (from the moment of login, not extended by activity). Then log in again.
    session-ttl: ${SESSION_TTL:4h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
